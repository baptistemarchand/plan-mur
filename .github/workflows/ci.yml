name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test

      - name: Build Cloudflare
        run: npm run build

      # Dry-run seulement : rien n'est déployé et aucun budget de taille n'est
      # imposé, c'est l'empaquetage Worker qui est vérifié.
      - name: Empaquetage Worker
        run: npx wrangler deploy --dry-run --outdir=/tmp/worker

      # Le Worker est démarré, pas seulement construit : un build qui passe ne
      # prouve rien, c'est workerd qui décide à l'exécution.
      - name: Smoke test sous workerd
        run: |
          npx wrangler d1 migrations apply plan-mur
          npx wrangler dev --port 3099 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:3099/ && break
            sleep 2
          done
          curl -sf -o /dev/null http://localhost:3099/ || { echo "le Worker ne répond pas"; exit 1; }
